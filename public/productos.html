<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos - Centro del Quesillo</title>
  <link rel="stylesheet" href="/css/icons.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <div class="view-tabs" id="view-tabs">
      <button type="button" data-view-link="lista">Lista</button>
      <button type="button" data-view-link="nuevo" id="tab-nuevo" class="hidden">Nuevo producto</button>
    </div>

    <!-- Vista 1: lista de productos -->
    <section data-view="lista">
      <h1>Productos del menú</h1>
      <div class="card" id="products"></div>
    </section>

    <!-- Vista 2: formulario de alta (solo admin) -->
    <section data-view="nuevo" class="hidden">
      <h1>Nuevo producto</h1>
      <div class="card">
        <form id="product-form">
          <div class="row">
            <div><label>Nombre</label><input id="p-name" required /></div>
            <div><label>Categoría</label><input id="p-category" required /></div>
            <div><label>Precio (córdobas)</label><input id="p-price" type="number" min="0" step="0.01" required /></div>
          </div>
          <label>Receta (insumos consumidos por unidad)</label>
          <div id="recipe-rows"></div>
          <div class="row mt-8">
            <div>
              <label>Insumo</label>
              <select id="r-ingredient"></select>
            </div>
            <div><label>Cantidad</label><input id="r-qty" type="number" min="0" step="0.001" /></div>
            <div><button type="button" id="add-recipe" class="ghost">Agregar insumo</button></div>
          </div>
          <p id="error" class="error"></p>
          <div class="view-head mt-12">
            <button type="button" class="ghost" data-goto="lista">Volver</button>
            <button type="submit">Crear producto</button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="/js/productos.js"></script>
</body>
</html>
