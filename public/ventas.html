<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ventas - Centro del Quesillo</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>Registrar venta</h1>
    <div class="card">
      <form id="sale-form">
        <div class="row">
          <div>
            <label for="customer">Cliente (opcional)</label>
            <input id="customer" name="customerName" placeholder="Nombre del cliente" />
          </div>
          <div>
            <button type="submit" style="margin-top: 22px">Registrar venta</button>
          </div>
        </div>
        <p id="error" class="error"></p>
        <table style="margin-top: 12px">
          <thead><tr><th>Producto</th><th>Precio</th><th>Cantidad</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </form>
    </div>

    <h2>Ventas recientes</h2>
    <div class="card" id="sales"></div>
  </main>
  <script type="module" src="/js/ventas.js"></script>
</body>
</html>
