<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero - Centro del Quesillo</title>
  <link rel="stylesheet" href="/css/icons.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>Tablero de decisiones</h1>

    <div class="period-bar" id="period-bar">
      <span class="muted">Periodo:</span>
      <button type="button" data-days="1">Hoy</button>
      <button type="button" data-days="7">7 días</button>
      <button type="button" data-days="30">30 días</button>
    </div>

    <div class="grid cols-3" id="stats"></div>

    <h2 id="revenue-title">Ingresos</h2>
    <div class="card card--chart"><div id="revenue-bars"></div></div>

    <div class="grid cols-2">
      <div>
        <h2>Productos más vendidos</h2>
        <div class="card" id="top-products"></div>
      </div>
      <div>
        <h2>Recomendación de producción (próximo día)</h2>
        <div class="card" id="recommendations"></div>
      </div>
    </div>

    <h2>Días de inventario restante</h2>
    <div class="card" id="inventory"></div>

    <h2>Alertas pendientes</h2>
    <div class="card" id="alerts"></div>
  </main>
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
