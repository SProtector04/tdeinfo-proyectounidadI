<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios - Centro del Quesillo</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>Usuarios</h1>
    <div class="card" id="users"></div>

    <h2>Nuevo usuario</h2>
    <div class="card">
      <form id="user-form">
        <div class="row">
          <div><label>Nombre</label><input id="u-name" required /></div>
          <div><label>Usuario</label><input id="u-username" required /></div>
          <div><label>Contrasena</label><input id="u-password" type="password" required /></div>
          <div>
            <label>Rol</label>
            <select id="u-role"><option value="CAJERO">CAJERO</option><option value="ADMIN">ADMIN</option></select>
          </div>
        </div>
        <p id="error" class="error"></p>
        <button type="submit" style="margin-top: 12px">Crear usuario</button>
      </form>
    </div>
  </main>
  <script type="module" src="/js/usuarios.js"></script>
</body>
</html>
