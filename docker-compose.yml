services:
  # Contenedor PostgreSQL (imagen oficial de Docker Hub). Almacena los datos
  # operativos (variables) en el volumen `pg-data`; los datos fijos de prueba
  # se siembran desde el codigo (src/infrastructure/persistence/seed.js).
  db:
    image: postgres:16-alpine
    container_name: cdq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdq}
      POSTGRES_DB: ${POSTGRES_DB:-cdq}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdq} -d ${POSTGRES_DB:-cdq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Aplicacion Node.js (imagen oficial de Docker Hub). Se conecta a PostgreSQL
  # por red; crea el esquema y siembra los datos de prueba (idempotente).
  app:
    build: .
    container_name: cdq-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdq}:${POSTGRES_PASSWORD:-cdq}@db:5432/${POSTGRES_DB:-cdq}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-cambiar-en-produccion}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      CAJERO_USER: ${CAJERO_USER:-cajero}
      CAJERO_PASSWORD: ${CAJERO_PASSWORD:-cajero123}
      CAJERO_NAME: ${CAJERO_NAME:-Cajero Principal}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pg-data:
