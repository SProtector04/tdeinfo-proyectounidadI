services:
  # Contenedor SQLite (imagen de Docker Hub): administra el archivo de base de
  # datos y expone el CLI sqlite3 para consultas, auditorias y respaldos.
  db:
    image: nouchka/sqlite3:latest
    container_name: cdq-db
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # Prepara el volumen y lo deja en propiedad del usuario `node` (uid 1000)
    # de la aplicacion, y mantiene vivo el CLI sqlite3 para administracion.
    command:
      - "mkdir -p /data && chown -R 1000:1000 /data && tail -f /dev/null"
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD", "sqlite3", "--version"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Aplicacion Node.js (imagen oficial de Docker Hub). Lee y escribe el mismo
  # volumen `db-data` que el contenedor SQLite (WAL habilitado).
  app:
    build: .
    container_name: cdq-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /data/cdq.db
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-cambiar-en-produccion}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      CAJERO_USER: ${CAJERO_USER:-cajero}
      CAJERO_PASSWORD: ${CAJERO_PASSWORD:-cajero123}
      CAJERO_NAME: ${CAJERO_NAME:-Cajero Principal}
    volumes:
      - db-data:/data
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
